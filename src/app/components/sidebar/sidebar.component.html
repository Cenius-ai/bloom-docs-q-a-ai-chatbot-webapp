<div class="sidebar">
  <header class="sidebar-header">
    <a routerLink="/conversations" class="logo" (click)="navigate.emit()">
      <svg class="logo-icon" width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="var(--accent)"/>
        <path d="M10 16c0-3.3 2.7-6 6-6s6 2.7 6 6-2.7 6-6 6" fill="none" stroke="var(--accent-fg)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">Bloom</span>
    </a>

    <button
      class="btn-new"
      (click)="newConversation()"
      aria-label="Start new conversation"
    >
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>New chat</span>
    </button>
  </header>

  <div class="search-box">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/>
      <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input
      type="search"
      placeholder="Search conversations…"
      [value]="searchQuery()"
      (input)="onSearchInput($event)"
      aria-label="Search conversations"
    />
  </div>

  <nav class="conversation-list" aria-label="Conversations">
    @for (conv of filteredConversations; track conv.id) {
    <a
      routerLink="/conversations/{{ conv.id }}"
      class="conv-item"
      [class.active]="activeId() === conv.id"
      (click)="selectConversation(conv.id)"
      [attr.aria-current]="activeId() === conv.id ? 'page' : undefined"
    >
      <svg class="conv-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M2 3.5h12v9a1 1 0 01-1 1H3a1 1 0 01-1-1V3.5z" stroke="currentColor" stroke-width="1.2"/>
        <path d="M2 3.5L8 8l6-4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="conv-info">
        <span class="conv-title">{{ conv.title }}</span>
        <span class="conv-date">{{ conv.updatedAt | date:'MMM d' }}</span>
      </div>
    </a>
    } @empty {
    <p class="empty-hint">No conversations yet. Start one!</p>
    }
  </nav>

  <footer class="sidebar-footer">
    <a routerLink="/documents" class="nav-link" (click)="navigate.emit()" aria-label="Document library">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M3 2.5h7l3 3v10a1 1 0 01-1 1H3a1 1 0 01-1-1v-12a1 1 0 011-1z" stroke="currentColor" stroke-width="1.3"/>
        <path d="M10 2.5v3h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Documents</span>
    </a>
    <a routerLink="/settings" class="nav-link" (click)="navigate.emit()" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.3"/>
        <path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.4 3.4l1.4 1.4M13.2 13.2l1.4 1.4M3.4 14.6l1.4-1.4M13.2 4.8l1.4-1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <span>Settings</span>
    </a>
  </footer>
</div>
